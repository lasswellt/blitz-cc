# blitz-check.yml — run /blitz:check on every pull request with claude-code-action.
# Installed by `/blitz:doctor --ci` at .github/workflows/blitz-check.yml.
#
# Auth: `anthropic_api_key` (an API key stored as the ANTHROPIC_API_KEY repository
# secret) is the default. Subscribers of Claude Pro/Max can use an OAuth token
# instead: replace the `anthropic_api_key` line with
#   claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
# (generate it with `claude setup-token`). Never set both.
#
# Fork PRs: GitHub withholds repository secrets from workflows triggered by pull
# requests from forks, so this job has no credentials there and fails at the
# action's auth step. Either run it only for same-repo branches (add
#   if: github.event.pull_request.head.repo.full_name == github.repository
# to the job) or run /blitz:check locally on fork PRs.
#
# `pull-requests: read` plus the inline-comment MCP tool is enough for review
# comments; the action posts through its own GitHub token, not a PAT.

name: blitz check

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  blitz-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # check --scope diff needs the merge base

      - name: Run /blitz:check on the diff
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/lasswellt/blitz-cc.git"
          plugins: "blitz@blitz"
          prompt: "/blitz:check --scope diff --comment"
          # --comment posts inline PR comments only when this tool is allowed.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
