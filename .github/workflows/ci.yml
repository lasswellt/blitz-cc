name: CI

# Runs the plugin's own validators on every push to main and every PR — the
# same gates the local pre-commit hook runs, enforced server-side. Deps (jq,
# python3, node) are preinstalled on ubuntu-latest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tooling versions
        run: jq --version && python3 --version && node --version && bash --version | head -1

      - name: SKILL.md frontmatter
        run: bash hooks/scripts/skill-frontmatter-validate.sh skills/*/SKILL.md

      - name: Agent frontmatter
        run: bash hooks/scripts/agent-frontmatter-validate.sh agents/*.md

      - name: Check-registry schema
        run: bash hooks/scripts/check-registry-validate.sh

      - name: Markdown links + anchors
        run: bash hooks/scripts/markdown-link-validate.sh

      - name: Section references resolve
        run: bash scripts/check-section-refs.sh

      # Authoritative skill-body token counts. The byte cap in
      # skill-frontmatter-validate.sh is a calibrated proxy; this is the real
      # measurement. Skipped without a credential rather than failing, because
      # forks and PRs from outside the repo have no secret.
      - name: Skill body token counts (advisory)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic
          bash scripts/count-tokens.sh --calibrate
          bash scripts/count-tokens.sh --skills | awk -F'\t' '$1 > 5000 {
            print "OVER THE 5,000-TOKEN COMPACTION CAP: " $2 " (" $1 " tokens)"; bad=1
          } END { exit bad }'

      - name: CLAUDE.md size guard (<=200 lines)
        run: test "$(wc -l < CLAUDE.md)" -le 200

      - name: Version-reference sync
        run: bash scripts/check-version-sync.sh

      - name: Plugin structure
        run: bash scripts/validate-plugin-structure.sh

      - name: Workflow JS syntax
        run: |
          for f in workflows/*.js; do
            node --check "$f"
          done

      - name: Catalog, dead references, numeric inventory
        run: bash scripts/gen-catalog.sh --check

      - name: Hook tests (bats)
        run: |
          command -v bats >/dev/null || sudo apt-get update && sudo apt-get install -y bats
          command -v bats >/dev/null || { echo "bats missing"; exit 1; }   # HTC-4: fail, don't skip vacuously
          bats hooks/tests/
          bash hooks/scripts/tests/test-link-resolver.sh

      - name: TIA scripts (bats)
        # E-043: listener + selector suites (also covered by the glob above;
        # listed separately so a test-impact regression is named in the job log).
        run: bats hooks/tests/test-listener.bats hooks/tests/test-selector.bats

  plugin-eval:
    # E-045: behavioural eval suite (`claude plugin eval`). ADVISORY — it never fails the
    # workflow on a grader score, only on a crash (no result document / unexpected exit).
    # GitHub does not expose the `secrets` context in a job-level `if`, so the gate is a
    # job-level env flag and every step is skipped when ANTHROPIC_API_KEY is absent (forks).
    runs-on: ubuntu-latest
    needs: validate
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_ANTHROPIC_KEY == 'true'

      - name: Install Claude Code + sandbox backend
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update && sudo apt-get install -y bubblewrap socat   # Bash grants need the OS sandbox
          claude --version

      - name: Run eval suite (advisory)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          set +e
          mkdir -p evals/results
          # Flags per `claude plugin eval --help` (2.1.276). --scaffold runs our own fixture.sh files;
          # --allow-tools Bash is required by the doctor/next/sessions cases (sandboxed).
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --allow-tools Bash \
            --no-publish \
            --max-cost-usd 20 \
            --json evals/results/run.json
          rc=$?
          echo "claude plugin eval exit code: $rc"
          if [ ! -s evals/results/run.json ]; then
            echo "::error::plugin eval produced no result document (crash)"; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open('evals/results/run.json'))
          a = d.get('aggregates', {})
          print(f"suite score={a.get('overallScore')} passed={a.get('casesPassed')}/{a.get('casesTotal')} meanDelta={a.get('meanDelta')} partial={d.get('partial')} ({d.get('partialReason')}) cost=${d.get('costUsd')}")
          for c in d.get('cases', []):
              ca = c.get('aggregates', {})
              print(f"  {c.get('name')}: score={ca.get('score')} delta={ca.get('delta')}")
          if not a.get('casesTotal'):
              print('::error::no eval cases ran'); sys.exit(1)
          if d.get('partial') and d.get('partialReason') == 'auth_failed':
              print('::error::credential rejected'); sys.exit(1)
          PY
          case "$rc" in
            0|1) echo "advisory: exit $rc (1 = a case scored below threshold; not a build failure)"; exit 0 ;;
            2)   echo "::warning::partial run (cost ceiling)"; exit 0 ;;
            *)   echo "::error::claude plugin eval crashed (exit $rc)"; exit 1 ;;
          esac

      - name: Upload eval results
        if: env.HAS_ANTHROPIC_KEY == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: evals/results
          if-no-files-found: warn
