name: Publish blitz-cc to npm

# Trusted publishing (OIDC) — no npm token, no 2FA. Authenticates via the
# GitHub Actions OIDC identity configured as a Trusted Publisher on npmjs.com.
# Runs on a published GitHub release, or manually (workflow_dispatch) for the
# first publish since the v2.0.0 release already exists.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # REQUIRED for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1; Node 20 ships an older npm.
      - name: Upgrade npm (trusted-publishing support)
        run: npm install -g npm@latest

      - name: Publish (OIDC, public, with provenance)
        run: npm publish --access public --provenance
